[package]
name = "bitbin"
description = "An (almost) drop-in replacement for bytebin written in Rust."
version = "0.1.0"
license = "AGPL-3.0"
repository = "https://github.com/Insprill/bitbin"
edition = "2024"

[lib]
proc-macro = true

[dependencies]
actix-web = { version = "4", default-features = false, features = ["macros", "http2", "rustls-0_21"] } # Zstd doesn't compile on aarch64 musl :/
anyhow = "1"
bytes = "1"
dotenvy = "0.15"
env_logger = "0.11"
envy = "0.4"
flate2 = "1"
log = "0.4"
quote = "1"
r2d2 = "0.8"
r2d2_sqlite = "0.35"
random-string = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
rustls = "0.21" # Must stay compatible with the version actix-web is using.
rustls-pemfile = "1"
serde = { version = "1", features = ["derive"] }
syn = "3"
toml = "1"

[profile.release]
panic = "abort"
codegen-units = 1
strip = true
lto = true
